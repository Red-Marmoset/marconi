org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# The ABIs the native library is built for, comma-separated (arm64-v8a, armeabi-v7a, x86_64, x86), and its
# configuration. Phones are arm64-v8a; add x86_64 for the emulator on a PC.
marconiAbis=arm64-v8a
marconiConfig=Release
